<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>任务栏监控部件 - 点击展开版</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        height: 100vh;
        display: flex;
        align-items: flex-end;
        background: linear-gradient(135deg, #a8c48a 0%, #8db06e 100%);
        font-family:
          "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI",
          sans-serif;
        user-select: none;
      }

      /* ===== 任务栏 ===== */
      .taskbar {
        width: 100%;
        height: 48px;
        background: rgba(243, 243, 241, 0.92);
        backdrop-filter: blur(20px);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 12px;
        gap: 4px;
        position: relative;
        z-index: 1;
      }

      /* ===== 监控部件 ===== */
      .widget {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 38px;
        padding: 0 14px 0 10px;
        background: rgba(255, 255, 255, 0.55);
        border-radius: 8px;
        margin-right: 6px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .widget:hover {
        background: rgba(255, 255, 255, 0.85);
      }
      .widget.active {
        background: rgba(255, 255, 255, 1);
      } /* 点击后高亮 */

      .widget .icon {
        font-size: 22px;
        line-height: 1;
      }
      .texts {
        display: flex;
        flex-direction: column;
      }
      .main {
        font-size: 13px;
        font-weight: 600;
        color: #1b1b1b;
        line-height: 16px;
        white-space: nowrap;
      }
      .main.hot {
        color: #c42b1c;
      }
      .sub {
        font-size: 10px;
        color: #6e6e6e;
        line-height: 14px;
        white-space: nowrap;
      }
      .sub b {
        font-weight: 400;
        color: #444;
      }

      /* ===== 展开面板（Win11 快速设置风格） ===== */
      .panel {
        position: fixed;
        right: 12px;
        bottom: 56px;
        width: 300px;
        background: rgba(249, 249, 249, 0.96);
        backdrop-filter: blur(40px);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        padding: 16px;
        z-index: 0;
        /* 展开动画：从任务栏方向弹出 */
        opacity: 0;
        transform: translateY(12px) scale(0.98);
        pointer-events: none;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      .panel.open {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      .panel h3 {
        font-size: 13px;
        font-weight: 600;
        color: #1b1b1b;
        margin-bottom: 2px;
      }
      .panel .updated {
        font-size: 10px;
        color: #999;
        margin-bottom: 12px;
      }

      .item {
        margin-bottom: 12px;
      }
      .item .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        line-height: 20px;
      }
      .item .k {
        font-size: 12px;
        color: #555;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .item .k .dot {
        font-size: 13px;
      }
      .item .v {
        font-size: 13px;
        font-weight: 600;
        color: #1b1b1b;
      }
      .item .v.warn {
        color: #c42b1c;
      }
      .item .v.ok {
        color: #1b1b1b;
      }

      .bar {
        height: 4px;
        background: #e4e4e4;
        border-radius: 2px;
        margin-top: 4px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 2px;
        background: #4c8bf5;
        transition: width 0.4s;
      }
      .bar i.hot {
        background: #c42b1c;
      }
      .bar i.warm {
        background: #f7630c;
      }

      .panel .footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        border-top: 1px solid rgba(0, 0, 0, 0.06);
        padding-top: 10px;
        margin-top: 4px;
        font-size: 11px;
        color: #888;
      }
      .panel .footer button {
        border: 1px solid #d0d0d0;
        background: #fff;
        border-radius: 6px;
        padding: 4px 12px;
        font-size: 11px;
        cursor: pointer;
        font-family: inherit;
      }
      .panel .footer button:hover {
        background: #f0f0f0;
      }

      /* ===== 天气组件与托盘（对照组） ===== */
      .clock {
        text-align: center;
        font-size: 12px;
        line-height: 15px;
        color: #1b1b1b;
        padding: 0 8px;
      }
    </style>
  </head>
  <body>
    <!-- ★ 点击展开的详情面板 -->
    <div class="panel" id="panel">
      <h3>系统监控</h3>
      <div class="updated" id="updated">刚刚更新</div>

      <div class="item">
        <div class="row">
          <span class="k"><span class="dot">🖥️</span>CPU 使用率</span>
          <span class="v warn" id="v-cpu">100%</span>
        </div>
        <div class="bar">
          <i class="hot" id="b-cpu" style="width: 100%"></i>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <span class="k"><span class="dot">🌡️</span>CPU 温度</span>
          <span class="v ok" id="v-cput">27.9°</span>
        </div>
        <div class="bar"><i id="b-cput" style="width: 28%"></i></div>
      </div>

      <div class="item">
        <div class="row">
          <span class="k"><span class="dot">📐</span>内存使用率</span>
          <span class="v ok" id="v-mem">59%</span>
        </div>
        <div class="bar"><i id="b-mem" style="width: 59%"></i></div>
      </div>

      <div class="item">
        <div class="row">
          <span class="k"><span class="dot">🧊</span>内存温度</span>
          <span class="v ok" id="v-memt">27.9°</span>
        </div>
        <div class="bar"><i id="b-memt" style="width: 28%"></i></div>
      </div>

      <div class="item">
        <div class="row">
          <span class="k"><span class="dot">💾</span>硬盘温度</span>
          <span class="v ok" id="v-diskt">52°</span>
        </div>
        <div class="bar"><i id="b-diskt" style="width: 52%"></i></div>
      </div>

      <div class="footer">
        <span>刷新间隔 1s</span>
        <button onclick="refreshNow()">立即刷新</button>
      </div>
    </div>

    <!-- ===== 任务栏 ===== -->
    <div class="taskbar">
      <!-- ★ 监控部件：点击切换展开 -->
      <div class="widget" id="widget">
        <span class="icon">🖥️</span>
        <div class="texts">
          <span class="main hot" id="m-main">100%</span>
          <span class="sub">T <b>28°</b> · M <b>59%</b> · D <b>52°</b></span>
        </div>
      </div>

      <div class="widget" style="cursor: default">
        <span class="icon">🌤️</span>
        <div class="texts">
          <span class="main">26°C</span><span class="sub">多云</span>
        </div>
      </div>

      <div style="font-size: 14px; padding: 0 8px; color: #444">⌃</div>
      <div style="font-size: 13px; padding: 0 8px; color: #444">英</div>
      <div style="font-size: 15px; padding: 0 8px">🔊</div>
      <div class="clock">14<br />2026/9</div>
    </div>

    <script>
      const widget = document.getElementById("widget");
      const panel = document.getElementById("panel");

      // 点击部件：切换面板
      widget.addEventListener("click", (e) => {
        e.stopPropagation();
        const open = panel.classList.toggle("open");
        widget.classList.toggle("active", open);
      });

      // 点击面板内部：不关闭
      panel.addEventListener("click", (e) => e.stopPropagation());

      // 点击其他任何地方：收起
      document.body.addEventListener("click", () => {
        panel.classList.remove("open");
        widget.classList.remove("active");
      });

      // 模拟 Rust 后端每秒推送
      function refreshNow() {
        tick();
      }
      function tick() {
        const cpu = Math.round(Math.random() * 30 + 70); // 使用率偏高
        const cput = (Math.random() * 5 + 26).toFixed(1); // 温度低位（你的数据就是26-28）
        const mem = Math.round(Math.random() * 8 + 55);
        const memt = (Math.random() * 3 + 26).toFixed(1);
        const diskt = Math.round(Math.random() * 4 + 50);

        const set = (id, val) =>
          (document.getElementById(id).textContent = val);
        set("v-cpu", cpu + "%");
        set("b-cpu", cpu + "%");
        set("v-cput", cput + "°");
        set("b-cput", (cput / 100) * 100 + "%");
        set("v-mem", mem + "%");
        set("b-mem", mem + "%");
        set("v-memt", memt + "°");
        set("v-diskt", diskt + "°");
        set("b-diskt", diskt + "%");

        // 任务栏主行/副行
        const main = document.getElementById("m-main");
        main.textContent = cpu + "%";
        main.classList.toggle("hot", cpu >= 80);
        document.querySelector("#widget .sub").innerHTML =
          `T <b>${Math.round(cput)}°</b> · M <b>${mem}%</b> · D <b>${diskt}°</b>`;

        document.getElementById("updated").textContent =
          "刚刚更新 · " +
          new Date().toLocaleTimeString("zh-CN", { hour12: false });
      }
      setInterval(tick, 1000);
    </script>
  </body>
</html>
