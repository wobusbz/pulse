[package]
name = "pulse"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A lightweight Windows taskbar system monitor (CPU / GPU / memory / disk)."
license = "MIT"
repository = "https://github.com/wobusbz/pulse"
readme = "README.md"
keywords = ["taskbar", "system-monitor", "windows", "gpui"]
categories = ["gui", "os::windows-apis"]

[[bin]]
name = "Pulse"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.6.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
libloading = "0.9.0"
dhat = { version = "0.3", optional = true }

[build-dependencies]
embed-resource = "3.0.11"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# 可选：启用堆分配剖析（dhat）。设置 PULSE_PROFILE=1 运行、PULSE_QUIT_AFTER_SECS=N 到点自动退出，
# 退出时写出 pulse-dhat-heap.json。
profiling = ["dep:dhat"]

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
core-foundation = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
