name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号的唯一来源是 Cargo.toml；打 tag 时校验 tag 与之一致（防止漂移）。
      - name: Verify version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Cargo.toml version: $version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag '$env:GITHUB_REF_NAME' does not match Cargo.toml version '$version'"
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build
        run: cargo build --release

      # Produces installer/Pulse-<version>-<target>-Setup.exe (name defined in pulse.nsi)
      - name: Package installer
        shell: cmd
        run: installer\build.bat

      # Portable bundle named after the installer, e.g. Pulse-0.1.0-windows-x64-portable.zip
      - name: Package portable
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/Pulse-*-Setup.exe | Select-Object -First 1
          if (-not $setup) { throw "installer not found in installer/" }
          $prefix = $setup.BaseName -replace '-Setup$', ''
          $out = "dist/$prefix"
          New-Item -ItemType Directory -Force -Path "$out/lib", "$out/assets" | Out-Null
          Copy-Item target/release/Pulse.exe "$out/"
          Copy-Item lib/LhmNative.dll "$out/lib/"
          Copy-Item lib/PawnIO_setup.exe "$out/lib/"
          Copy-Item installer/pulse.ico "$out/assets/"
          Compress-Archive -Path $out -DestinationPath "dist/$prefix-portable.zip" -Force
          Copy-Item target/release/Pulse.exe "dist/$prefix.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-windows-x64
          path: |
            installer/Pulse-*-Setup.exe
            dist/*-portable.zip
            dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Pulse-*-Setup.exe
            dist/*-portable.zip
            dist/*.exe
          generate_release_notes: true
