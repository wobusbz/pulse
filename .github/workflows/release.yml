name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build
        run: cargo build --release

      - name: Package installer
        shell: cmd
        run: installer\build.bat

      # Portable build: Pulse.exe + lib/ + assets/, zipped for a self-contained download.
      - name: Package portable
        shell: pwsh
        run: |
          $out = "dist/Pulse"
          New-Item -ItemType Directory -Force -Path "$out/lib", "$out/assets" | Out-Null
          Copy-Item target/release/Pulse.exe "$out/"
          Copy-Item lib/LhmNative.dll "$out/lib/"
          Copy-Item lib/PawnIO_setup.exe "$out/lib/"
          Copy-Item installer/pulse.ico "$out/assets/"
          Compress-Archive -Path $out -DestinationPath dist/Pulse-portable.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pulse
          path: |
            dist/Pulse-portable.zip
            installer/PulseSetup.exe
            target/release/Pulse.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Pulse-portable.zip
            installer/PulseSetup.exe
            target/release/Pulse.exe
          generate_release_notes: true
