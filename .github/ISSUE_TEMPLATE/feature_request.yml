name: 功能建议
description: 提出一个想法或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在有什么不便？为什么需要这个功能？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其它可选方案
    validations:
      required: false

  - type: input
    id: platform
    attributes:
      label: 相关平台
      placeholder: Windows / Linux / macOS
    validations:
      required: false
